name: Build Electron Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
          include:
          # - os: ubuntu-latest
          #    script: build:linux:x64

          #  - os: ubuntu-24.04-arm
          #    script: build:linux:arm64

            - os: ubuntu-24.04-arm
              script: build:linux:arm32

          #- os: windows-latest
          #  script: build:win

          #- os: macos-latest
          #  script: build:mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        uses: addnab/docker-run-action@v3
        with:
          image: arm32v7/node:22
          options: --platform linux/arm/v7
          run: |
            npm ci
            npm run build:linux:armv7l

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}